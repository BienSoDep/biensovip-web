# Path-based router (client-side pushState) — every non-asset path serves index.html to real
# browsers. Bots (Googlebot, Google-InspectionTool, Zalo, Facebook, AI search crawlers) don't run JS,
# so they're routed instead to the backend's /render/* dynamic-rendering endpoints, which return real
# HTML with title/meta/OG/JSON-LD per UC-SEO01.
map $http_user_agent $is_bot {
    default 0;
    "~*googlebot|google-inspectiontool|googleother|storebot-google|adsbot-google|mediapartners-google|apis-google|feedfetcher-google|bingbot|yandex|baiduspider|duckduckbot|facebookexternalhit|facebot|twitterbot|linkedinbot|whatsapp|zalobot|telegrambot|slackbot|discordbot|pinterest|redditbot|applebot|oai-searchbot|chatgpt-user|gptbot|perplexitybot|claudebot|anthropic-ai|cohere-ai|google-extended|meta-externalagent|bytespider|ccbot" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bot request to a real content page → proxy to backend dynamic-render endpoint instead of
    # serving the empty SPA shell. Real browsers fall through to try_files → index.html as before.
    location / {
        try_files $uri $uri/ @spa_or_bot;
    }

    location @spa_or_bot {
        if ($is_bot) {
            rewrite ^/$ /render/ break;
            rewrite ^/(.+)$ /render/$1 break;
            proxy_pass http://api:8080;
        }
        try_files /index.html =404;
    }

    # Static assets — long cache, filenames are content-hashed by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html references hashed asset filenames — must never be cached, or a stale shell
    # keeps requesting chunk files a new deploy already deleted (dynamic import 404 loop).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
