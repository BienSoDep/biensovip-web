name: Dependency security scan

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: npm audit (high/critical only)
        run: npm audit --audit-level=high
